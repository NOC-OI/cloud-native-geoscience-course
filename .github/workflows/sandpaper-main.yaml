name: "01 Build and Deploy Site"

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:
    inputs:
      name:
        description: 'Who triggered this build?'
        required: true
        default: 'Maintainer (via GitHub)'
      reset:
        description: 'Reset cached markdown files'
        required: false
        default: false
        type: boolean
jobs:
  full-build:
    name: "Build Full Site"

    # 2024-10-01: ubuntu-latest is now 24.04 and R is not installed by default in the runner image
    # pin to 22.04 for now
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: write
      pages: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv/
    steps:

      - name: "Checkout Lesson"
        uses: actions/checkout@v4

      - name: "Set up R"
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          install-r: false

      - name: "Set up Pandoc"
        uses: r-lib/actions/setup-pandoc@v2

      - name: "Setup Lesson Engine"
        uses: carpentries/actions/setup-sandpaper@main
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: "Setup Package Cache"
        uses: carpentries/actions/setup-lesson-deps@main
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: "Deploy Site"
        run: |
          reset <- "${{ github.event.inputs.reset }}" == "true"
          sandpaper::package_cache_trigger(TRUE)
          sandpaper:::ci_deploy(reset = reset)
        shell: Rscript {0}

      - name: "Patch mobile navbar on gh-pages"
        run: |
          set -eu

          git fetch origin gh-pages:gh-pages
          git checkout gh-pages

          style='<style id="mobile-hide-aio-search">@media (max-width: 767.98px){#search-button{display:none!important;}}</style>'

          find . -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            if ! grep -q 'mobile-hide-aio-search' "$file"; then
              sed -i "s#</head>#${style}</head>#" "$file"
            fi
          done

          if ! git diff --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "[skip ci] hide all-in-one search button on mobile"
            git push origin gh-pages
          else
            echo "No mobile navbar patch changes to commit"
          fi
        shell: bash
